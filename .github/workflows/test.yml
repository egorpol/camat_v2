name: Tests and documentation

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - "beta/**"
  pull_request:

permissions:
  contents: read

jobs:
  checkout-tests:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - run: python -m pip install ".[test]"
      - run: python -m pytest tests --ignore=tests/release -q

  docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            docs/requirements.txt
      - run: python -m pip install . -r docs/requirements.txt
      - run: python -m mkdocs build --strict

  installed-wheel-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Build, install, and test wheel in a fresh venv
        run: >-
          python scripts/test_release_matrix.py
          --versions "${{ matrix.python-version }}"
          --python "${{ matrix.python-version }}=python"
      - name: Retain tested dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-baseline-${{ matrix.python-version }}
          path: .release-runs/**/installed-dependencies.json
          include-hidden-files: true
          if-no-files-found: warn
