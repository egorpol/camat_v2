name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version_check.outputs.package_version }}
      tag_name: ${{ steps.version_check.outputs.tag_name }}
      prerelease: ${{ steps.version_check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "packaging>=24"
      - name: Validate versions and release notes before compatibility tests
        id: version_check
        run: python scripts/prepare_release.py --notes release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  compatibility:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    needs: compatibility
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
      - name: Verify tested release files before publishing
        working-directory: dist
        run: sha256sum --check --strict ../release-checksums.txt
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs:
      - preflight
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          name: camat ${{ needs.preflight.outputs.package_version }}
          tag_name: ${{ needs.preflight.outputs.tag_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.prerelease == 'true' && 'false' || 'true' }}
