name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  compatibility:
    uses: ./.github/workflows/test.yml

  build:
    needs: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version_check.outputs.package_version }}
      tag_name: ${{ steps.version_check.outputs.tag_name }}
      prerelease: ${{ steps.version_check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U build twine
      - name: Validate versions and release notes before publication
        id: version_check
        run: python scripts/prepare_release.py --notes release-notes.md
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          name: camat ${{ needs.build.outputs.package_version }}
          tag_name: ${{ needs.build.outputs.tag_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'true' && 'false' || 'true' }}
