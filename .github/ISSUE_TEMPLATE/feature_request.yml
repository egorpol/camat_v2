name: Feature request
description: Propose a bounded improvement to a CAMAT workflow.
title: "[Feature]: "
body:
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - MEI edition / facsimile viewer
        - Conversion to MEI
        - MEI parsing / representation
        - Analysis / visualization
        - Documentation / developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need independently of a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same request.
          required: true
