site_name: CAMAT
site_description: "Computer-Assisted Music Analysis Toolbox: editing music with MEI, parsing music representations, and analysing music with statistics and pattern search"
site_author: Egor Polyakov, Martin Pfleiderer, and Pia Steuck
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://camat-v2.readthedocs.io/en/stable/"]
strict: true

repo_url: https://github.com/egorpol/camat_v2
repo_name: camat_v2

docs_dir: docs

hooks:
  - scripts/docs_hooks.py

theme:
  name: material

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - privacy:
      assets: false
      links_attr_map:
        target: _blank
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start:
      - Home: index.md
      - Getting started: getting-started.md
      - Cloud notebooks: cloud-notebooks.md
      - Edition corpora: guides/edition-corpora.md
      - Notebook roadmap: notebooks.md
      - Known limitations: known-limitations.md
  - Workflows:
      - 1. Editing music with the MEI data format:
          - Workflow overview: guides/edition-building.md
          - Introduction to MEI and XML: guides/mei-introduction.md
          - Convert to MEI: guides/formats.md
          - Batch conversion: guides/batch-conversion.md
          - Test sources: guides/sources.md
      - 2. Parse music into CAMAT representations: guides/parsing-representations.md
      - "3. Analyse music: statistics and pattern search":
          - Workflow overview: guides/analysis.md
          - Statistics: guides/statistics.md
          - Pattern search: guides/pattern-search.md
          - Binary representations: guides/binary-representations.md
  - Further guides:
      - Backend and specialized parsing: tutorial.md
  - Documentation:
      - Overview: reference.md
      - API:
          - Top-level API: api/camat.md
          - Analysis utils: api/analysis_utils.md
          - Binary matrix designer: api/binary_matrix_designer.md
          - Binary convolution: api/binary_convolution.md
          - Independent binary queries: api/binary_query.md
          - Binary roundtrip: api/binary_roundtrip.md
          - Conversion: api/conversion.md
          - Edition and IIIF pipeline: api/edition_pipeline.md
          - MEI consistency and cleanup: api/mei_consistency.md
          - MEI facsimile viewer: api/facsimile_viewer.md
          - Mensural utils: api/mensural_utils.md
          - MIDI timing: api/midi_timing.md
          - Music21 backend: api/music21_backend.md
          - Music21 render: api/music21_render.md
          - Music utils: api/music_utils.md
          - Overlay: api/overlay.md
          - Parser registry: api/parser_registry.md
          - Parser utils: api/parser_utils.md
          - Partitura backend: api/partitura_backend.md
          - Verovio backend: api/verovio_backend.md
          - Pattern search: api/pattern_search.md
          - Timeline backend: api/timeline_backend.md
          - Verovio render: api/verovio_render.md
  - Project:
      - About and citation: about.md
      - Contributing: contributing.md
      - Release testing: releasing.md
