site_name: CAMAT
site_description: "MEI-centered editorial, conversion, parsing, and analysis workflows"
site_url: https://camat.readthedocs.io
strict: true

repo_url: https://github.com/egorpol/camat_v2
repo_name: camat_v2

docs_dir: docs

hooks:
  - scripts/docs_hooks.py

theme:
  name: material

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: numpy
            show_source: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start:
      - Home: index.md
      - What CAMAT is: overview.md
      - Edition corpora: guides/edition-corpora.md
      - Notebook roadmap: notebooks.md
      - Known limitations: known-limitations.md
  - Workflows:
      - 1. Handling MEI files:
          - Workflow overview: guides/edition-building.md
          - Introduction to MEI and XML: guides/mei-introduction.md
      - 2. Convert to MEI:
          - Workflow overview: guides/formats.md
          - Batch conversion: guides/batch-conversion.md
          - Test sources: guides/sources.md
      - 3. Parse and represent MEI: guides/parsing-representations.md
      - 4. Analyse representations: guides/analysis.md
  - Further guides:
      - Backend and specialized parsing: tutorial.md
      - Release testing: releasing.md
  - Reference:
      - Overview: reference.md
      - API:
          - Top-level API: api/camat.md
          - Analysis utils: api/analysis_utils.md
          - Binary matrix designer: api/binary_matrix_designer.md
          - Conversion: api/conversion.md
          - Edition and IIIF pipeline: api/edition_pipeline.md
          - MEI consistency and cleanup: api/mei_consistency.md
          - MEI facsimile viewer: api/facsimile_viewer.md
          - Mensural utils: api/mensural_utils.md
          - MIDI timing: api/midi_timing.md
          - Music21 backend: api/music21_backend.md
          - Music21 render: api/music21_render.md
          - Music utils: api/music_utils.md
          - Overlay: api/overlay.md
          - Parser registry: api/parser_registry.md
          - Parser utils: api/parser_utils.md
          - Partitura backend: api/partitura_backend.md
          - Verovio backend: api/verovio_backend.md
          - Pattern search: api/pattern_search.md
          - Timeline backend: api/timeline_backend.md
          - Verovio render: api/verovio_render.md
