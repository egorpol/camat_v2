[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camat"
version = "0.1.12"
description = "CAMAT: tools for symbolic music parsing, analysis, and rendering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Egor Polyakov" },
]
keywords = ["music", "symbolic-music", "analysis", "music21", "partitura", "verovio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/egorpol/camat_v2"
Repository = "https://github.com/egorpol/camat_v2"
Issues = "https://github.com/egorpol/camat_v2/issues"
Changelog = "https://github.com/egorpol/camat_v2/blob/main/CHANGELOG.md"
Documentation = "https://camat.readthedocs.io/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["camat*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
