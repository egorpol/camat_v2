[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camat"
version = "0.2.3b1"
description = "CAMAT: tools for symbolic music parsing, analysis, and rendering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND ECL-2.0"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Egor Polyakov" },
  { name = "Martin Pfleiderer" },
  { name = "Pia Steuck" },
]
keywords = ["music", "symbolic-music", "analysis", "music21", "partitura", "verovio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8", "packaging>=24"]
notebooks = ["jupyterlab>=4"]

[project.scripts]
camat-convert = "camat.conversion:main"
camat-check-mei = "camat.check_mei_consistency:main"
camat-convert-harm-startid = "camat.convert_harm_startid_to_tstamp:main"
camat-link-pb-surface = "camat.link_pb_to_surface:main"
camat-check-bsb-page-coverage = "camat.check_bsb_page_coverage:main"
camat-corpus-cleanup = "camat.corpus_cleanup:main"
camat-facsimile-download = "camat.facsimile_downloader:main"
camat-fetch-bsb-metadata = "camat.fetch_bsb_metadata:main"
camat-generate-volume-pages = "camat.generate_volume_pages:main"
camat-integrate-annotation-file = "camat.integrate_measure_annotations:main"
camat-integrate-annotations = "camat.upload_and_integrate_measure_annotations:main"
camat-run-pipeline = "camat.run_pipeline:main"
camat-validate-iiif = "camat.validate_iiif_vs_local:main"
camat-fetch-tutorials = "camat.notebook_workspace:main"

[project.urls]
Homepage = "https://github.com/egorpol/camat_v2"
Repository = "https://github.com/egorpol/camat_v2"
Issues = "https://github.com/egorpol/camat_v2/issues"
Changelog = "https://github.com/egorpol/camat_v2/blob/main/CHANGELOG.md"
Documentation = "https://camat-v2.readthedocs.io/en/stable/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["camat*"]

[tool.setuptools.package-data]
camat = ["examples/*.mei", "examples/*.svg", "schemas/*.rng"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
